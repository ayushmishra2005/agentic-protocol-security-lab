name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # The Daml toolchain is not installed on the runner, so these are the
      # host-boundary unit tests only. Toolchain-dependent verification runs
      # locally against the pinned dpm 1.0.21 / SDK 3.5.5.
      - name: Unit tests
        run: npm test
