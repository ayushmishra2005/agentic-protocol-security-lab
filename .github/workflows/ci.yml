name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # The Daml toolchain is not installed on the runner, so these are the
      # host-boundary unit tests only. The F01 oracle integration test requires the
      # pinned dpm 1.0.21 / SDK 3.5.5 and runs locally via `npm run test:integration`.
      - name: Unit tests
        run: npm run test:unit
